# Restoring the database from a backup to a new pg-restore cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-restore
  namespace: postgres
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: ${STORAGE_CLASS}
  bootstrap:
    recovery:
      source: origin
      # uncomment to restore a backup from a specific time
      # recoveryTarget:
      #   targetTime: "2026-11-20 12:00:00+00"
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-main-store
          serverName: pg-main
