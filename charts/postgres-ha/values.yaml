cluster:
  name: pg-main
  instances: 3                      
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  database: appdb
  owner: app

  storage:
    size: 100Gi
    # Local storage
    storageClass: local-lvm

  resources:
    requests: {cpu: "4", memory: 8Gi}
    limits:   {cpu: "4", memory: 8Gi}

  postgresql:
    parameters:                      
      shared_buffers: "2GB"          # ~25% RAM
      effective_cache_size: "6GB"    # ~75% RAM
      max_connections: "200"

  synchronous:
    enabled: true
    number: 1                        
    dataDurability: required
    failoverQuorum: true

externalService:
  enabled: true
  loadBalancerIP: ""                 # empty = first available IP from the pool. A fixed IP should be set in production.

backup:
  enabled: true
  retentionPolicy: "14d"
  schedule: "0 0 2 * * *"            
  s3:
    bucket: pg-backups
    endpoint: http://minio.storage.svc:9000   # in production the S3 endpoint should be outside the cluster
    credentialsSecret: backup-s3     
