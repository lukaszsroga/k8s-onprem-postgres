{{- if and .Values.cluster.synchronous.enabled (ge (int .Values.cluster.synchronous.number) (int .Values.cluster.instances)) }}
{{- fail "cluster.synchronous.number must be less than cluster.instances" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.imageName }}

  # The application user's password should be generated by the operator. It should not be in git.
  bootstrap:
    initdb:
      database: {{ .Values.cluster.database }}
      owner: {{ .Values.cluster.owner }}

  storage:
    size: {{ .Values.cluster.storage.size }}
    storageClass: {{ .Values.cluster.storage.storageClass }}

  resources:
    {{- toYaml .Values.cluster.resources | nindent 4 }}

  postgresql:
    parameters:
      {{- toYaml .Values.cluster.postgresql.parameters | nindent 6 }}
    {{- if .Values.cluster.synchronous.enabled }}
    synchronous:
      method: any
      number: {{ .Values.cluster.synchronous.number }}
      dataDurability: {{ .Values.cluster.synchronous.dataDurability }}
      failoverQuorum: {{ .Values.cluster.synchronous.failoverQuorum }}
    {{- end }}

  # each instance should be on a different node
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  {{- if .Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.cluster.name }}-store
  {{- end }}

  {{- if .Values.externalService.enabled }}
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ .Values.cluster.name }}-rw-ext
              {{- with .Values.externalService.loadBalancerIP }}
              annotations:
                metallb.io/loadBalancerIPs: {{ . | quote }}
              {{- end }}
            spec:
              type: LoadBalancer
  {{- end }}
